bundle:
  name: logistics-lakehouse
  databricks_cli_version: '1.27.0'

include:
  - resources/*.yml

sync:
  paths:
    - .
  exclude:
    - .github/**
    - db/**
    - docs/**
    - evidence/**
    - scripts/**
    - tests/**

variables:
  catalog:
    description: Existing Unity Catalog catalog that contains this target
  schema:
    description: Isolated schema for the feed, pipeline tables and volumes
  landing_path:
    description: Absolute path to the managed landing volume
  commit_sha:
    description: Git revision of the deployed files
    default: unrecorded
  release_root:
    description: Shared deployment directory for the release target
    default: ''
  release_service_principal:
    description: Application ID of the release execution identity
    default: ''

targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev/${var.schema}
    run_as:
      user_name: ${workspace.current_user.userName}
  release:
    mode: production
    workspace:
      root_path: ${var.release_root}
    run_as:
      service_principal_name: ${var.release_service_principal}
