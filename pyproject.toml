[project]
name = "databricks-logistics-lakehouse"
version = "0.1.0"
description = "Verify shipment history for late events, deletes, and repeated deliveries"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "PyYAML==6.0.3",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/notebooks/*.py" = ["E402", "F821"]
"src/pipelines/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
